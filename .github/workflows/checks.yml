name: Shared Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: B tests if present
        run: |
          if [ -f modules/b-research/service.test.ts ]; then npm run test:b; fi
      - run: npm run build
